name: Fork image (rag-collection-cache)

# Fork-only workflow: builds the ollama variant (USE_OLLAMA=true, equivalent to :ollama) linux/amd64 image from the
# feature branch and pushes it to this repository's GHCR namespace.

on:
  workflow_dispatch:
  push:
    branches:
      - feat/rag-collection-cache

concurrency:
  group: fork-image-${{ github.ref }}
  cancel-in-progress: true

env:
  REGISTRY: ghcr.io

jobs:
  build:
    runs-on: ubuntu-latest
    permissions:
      contents: read
      packages: write
    steps:
      - name: Prepare environment
        run: |
          echo "FULL_IMAGE_NAME=${REGISTRY}/${GITHUB_REPOSITORY,,}" >> "${GITHUB_ENV}"
          echo "SHORT_SHA=${GITHUB_SHA::12}" >> "${GITHUB_ENV}"

      - name: Checkout repository
        uses: actions/checkout@v5

      - name: Set up Docker Buildx
        uses: docker/setup-buildx-action@v3

      - name: Prepare CI Dockerfile
        run: |
          awk '
            /^FROM --platform=\$BUILDPLATFORM node:/ {
              print
              print "ENV NODE_OPTIONS=\"--max-old-space-size=12288\""
              next
            }
            /^ENV HOME=\/root/ {
              print
              print "ENV DATA_DIR=/workspace/open-webui/data OLLAMA_MODELS=/workspace/ollama/models"
              next
            }
            { print }
          ' Dockerfile > "${RUNNER_TEMP}/Dockerfile"

      - name: Log in to the Container registry
        uses: docker/login-action@v3
        with:
          registry: ${{ env.REGISTRY }}
          username: ${{ github.actor }}
          password: ${{ secrets.GITHUB_TOKEN }}

      - name: Build and push
        uses: docker/build-push-action@v5
        with:
          context: .
          file: ${{ runner.temp }}/Dockerfile
          push: true
          platforms: linux/amd64
          tags: |
            ${{ env.FULL_IMAGE_NAME }}:rag-cache-ollama
            ${{ env.FULL_IMAGE_NAME }}:rag-cache-ollama-git-${{ env.SHORT_SHA }}
          cache-from: type=registry,ref=${{ env.FULL_IMAGE_NAME }}:cache-rag-cache-ollama
          cache-to: type=registry,ref=${{ env.FULL_IMAGE_NAME }}:cache-rag-cache-ollama,mode=max
          build-args: |
            BUILD_HASH=${{ github.sha }}
            BUILD_CHANNEL=main
            USE_OLLAMA=true
